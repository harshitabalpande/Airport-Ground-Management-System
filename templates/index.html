<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Ground Management System | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-icon" aria-hidden="true">✈️</div>
        <h1>Airport Ground Management System</h1>
        <p class="auth-subtitle">Sign in to manage airport ground operations</p>

        {% if error %}
            <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your registered email"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password" required>

            <button type="submit" class="auth-submit">Login</button>
        </form>

        <div class="signup-link">
            New user?
            <a href="{{ url_for('signup') }}">Create an account</a>
        </div>

        <p class="auth-footer">Airport Ground Operations Management</p>
    </main>
</body>
</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Airport Ground Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* Ensure the login card is centered on the full screen */
        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        .auth-page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            box-sizing: border-box;
            background:
                radial-gradient(circle at 12% 15%,
                    rgba(13, 148, 136, 0.09), transparent 30%),
                #f2f6fb;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 36px;
            background: #ffffff;
            border: 1px solid #dce6f0;
            border-radius: 20px;
            box-shadow: 0 20px 55px rgba(23, 54, 93, 0.12);
        }

        .auth-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #e1f5f3;
            font-size: 36px;
        }

        .auth-card h1 {
            color: #17365d;
            font-size: 27px;
            line-height: 1.3;
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
        }

        .auth-form label {
            color: #334155;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-form input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 19px;
            border: 1px solid #cbd8e6;
            border-radius: 9px;
            background: #ffffff;
            color: #1f2937;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .auth-form input:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .auth-submit {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 9px;
            background: #0d9488;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .auth-submit:hover {
            background: #0f766e;
            transform: translateY(-1px);
        }

        .signup-link {
            margin-top: 22px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .signup-link a {
            color: #0d827a;
            text-decoration: none;
            font-weight: 700;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .auth-footer {
            border-top: 1px solid #e7edf4;
            margin-top: 26px;
            padding-top: 18px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        @media (max-width: 480px) {
            .auth-page {
                padding: 20px 14px;
            }

            .auth-card {
                padding: 28px 22px;
                border-radius: 16px;
            }

            .auth-card h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-icon" aria-hidden="true">
                ✈️
            </div>

            <h1>Airport Ground<br>Management System</h1>

            <p class="auth-subtitle">
                Sign in to manage airport ground operations
            </p>

            {% if error %}
                <div class="alert alert-error" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form class="auth-form"
                  method="POST"
                  action="{{ url_for('login') }}">

                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="auth-submit">
                    Login
                </button>

            </form>

            <p class="signup-link">
                New user?
                <a href="{{ url_for('signup') }}">
                    Create an account
                </a>
            </p>

            <footer class="auth-footer">
                <p>Airport Ground Management System</p>
                <p>Airport Operations Portal</p>
            </footer>

        </section>

    </main>

</body>
</html>
